name: Build and create draft release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-app:
    name: Build app
    uses: ./.github/workflows/build-app.yaml
    with:
      tag: ${{ github.ref_name }}

  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: [build-app]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: tunestudio-*

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The app's updater reads the published release's latest.json and trusts it only with this key's signature
      # (apps/studio/electron/updates/). This is the only job that has the key.
      - name: Sign the update feed
        env:
          TUNESTUDIO_UPDATE_KEY: ${{ secrets.TUNESTUDIO_UPDATE_KEY }}
        run: bun apps/studio/scripts/update-manifest.ts artifacts "$GITHUB_REF_NAME"

      # The changelog lists the commits since the previous release's tag; the first release has none to compare with.
      - name: Find the previous release
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        if: steps.previous.outputs.tag != ''
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          writeToFile: false
          # The commits aren't Conventional Commits: list them under "Other Changes" instead of dropping them.
          includeInvalidCommits: true
          excludeTypes: build,docs,style
          excludeScopes: release

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          body: ${{ steps.changelog.outputs.changes || 'The first release of Tune Studio.' }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
